name: Docker Build and Publish

on:
  push:
    branches:
      - feat/backend-docker-despliegue

  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Obtener nombre del propietario en minusculas
        id: vars
        run: |
          OWNER=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "owner=$OWNER" >> "$GITHUB_OUTPUT"

      - name: Iniciar sesion en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir y publicar backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: servicios/dominio/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.vars.outputs.owner }}/kipu-fraudshield-dominio:latest

      - name: Construir y publicar frontend
        uses: docker/build-push-action@v6
        with:
          context: ./servicios/front
          file: ./servicios/front/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.vars.outputs.owner }}/kipu-fraudshield-front:latest