services:
  caddy:
    image: caddy:2-alpine
    container_name: kipu-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - kipu_caddy_data:/data
      - kipu_caddy_config:/config
    depends_on:
      - gateway

  gateway:
    image: nginx:1.27-alpine
    container_name: kipu-gateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./servicios/gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - front
      - dominio

  front:
    build:
      context: ./servicios/front
      dockerfile: Dockerfile
    restart: unless-stopped

  dominio:
    build:
      context: .
      dockerfile: servicios/dominio/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://kipu_user:${POSTGRES_PASSWORD}@postgres:5432/kipu_fraudshield
      AWS_DEFAULT_REGION: us-east-1
      KIPU_SAGEMAKER_ENDPOINT: kipu-fraudshield-ep3-endpoint-v3
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      KIPU_API_KEY: ${KIPU_API_KEY:?KIPU_API_KEY_no_configurada}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: kipu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: kipu_fraudshield
      POSTGRES_USER: kipu_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - kipu_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kipu_user -d kipu_fraudshield"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
  
  worker_llm:
    build:
      context: .
      dockerfile: servicios/worker_llm/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://kipu_user:${POSTGRES_PASSWORD}@postgres:5432/kipu_fraudshield
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY}
      NVIDIA_MODEL: ${NVIDIA_MODEL}
    depends_on:
      rabbitmq:
        condition: service_started
      postgres:
        condition: service_healthy

volumes:
  kipu_postgres_data:
  kipu_caddy_data:
  kipu_caddy_config: