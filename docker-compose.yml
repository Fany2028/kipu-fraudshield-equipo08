services:
  gateway:
    image: nginx:1.27-alpine
    container_name: kipu-gateway
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./servicios/gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - front
      - dominio

  front:
    build:
      context: ./servicios/front
      dockerfile: Dockerfile
    restart: unless-stopped

  dominio:
    build:
      context: .
      dockerfile: servicios/dominio/Dockerfile
    restart: unless-stopped
    environment:
      MODEL_DIR: /app/modelo
      DATABASE_URL: postgresql://kipu_user:${POSTGRES_PASSWORD}@postgres:5432/kipu_fraudshield
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: kipu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: kipu_fraudshield
      POSTGRES_USER: kipu_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - kipu_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kipu_user -d kipu_fraudshield"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kipu_postgres_data: