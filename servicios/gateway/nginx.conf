events {}

http {
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Aplicar el límite solamente al endpoint de predicción
    map $uri $kipu_rate_key {
        default "";
        /api/predict $binary_remote_addr;
    }

    limit_req_zone $kipu_rate_key zone=kipu_predict:10m rate=5r/m;

    upstream dominio_backend {
        zone dominio_backend 64k;
        server dominio:8000 resolve;
    }

    server {
        listen 80;

        # API del backend
        location /api/ {
            limit_req zone=kipu_predict burst=5 nodelay;
            limit_req_status 429;

            proxy_pass http://dominio_backend;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }

        # Salud del backend
        location /health {
            proxy_pass http://dominio_backend;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }

        # Página principal del frontend

        # Documentacion de FastAPI
        location = /docs {
            proxy_pass http://dominio_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Esquema OpenAPI usado por Swagger
        location = /openapi.json {
            proxy_pass http://dominio_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /docs/ {
            proxy_pass http://dominio_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://front:80;
            proxy_set_header Host $host;
        }
    }
}